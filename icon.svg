<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2e1a"/>
      <stop offset="1" stop-color="#0a120a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d774"/>
      <stop offset="1" stop-color="#c8941a"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e05a3a"/>
      <stop offset="1" stop-color="#a83218"/>
    </linearGradient>
  </defs>

  <!-- 背景圆 -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#gold)" stroke-width="8"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#2e4428" stroke-width="2"/>

  <!-- 草地平台 -->
  <ellipse cx="256" cy="400" rx="170" ry="30" fill="#2e4a28"/>
  <ellipse cx="256" cy="392" rx="170" ry="26" fill="#3a5c32"/>

  <!-- 城堡主体 -->
  <rect x="156" y="240" width="200" height="160" rx="6" fill="#8b6b3e"/>
  <rect x="156" y="240" width="200" height="160" rx="6" fill="none" stroke="#5a4426" stroke-width="4"/>

  <!-- 墙面砖纹 -->
  <line x1="156" y1="280" x2="356" y2="280" stroke="#6e5430" stroke-width="3"/>
  <line x1="156" y1="320" x2="356" y2="320" stroke="#6e5430" stroke-width="3"/>
  <line x1="156" y1="360" x2="356" y2="360" stroke="#6e5430" stroke-width="3"/>
  <line x1="206" y1="240" x2="206" y2="280" stroke="#6e5430" stroke-width="2"/>
  <line x1="256" y1="240" x2="256" y2="280" stroke="#6e5430" stroke-width="2"/>
  <line x1="306" y1="240" x2="306" y2="280" stroke="#6e5430" stroke-width="2"/>

  <!-- 城门 -->
  <path d="M226 400 L226 340 Q256 310 286 340 L286 400 Z" fill="#3a2a14"/>
  <path d="M226 400 L226 340 Q256 310 286 340 L286 400 Z" fill="none" stroke="#1a1208" stroke-width="4"/>
  <circle cx="256" cy="370" r="5" fill="url(#gold)"/>

  <!-- 左侧塔楼 -->
  <rect x="120" y="200" width="70" height="200" rx="4" fill="#a07c46"/>
  <rect x="120" y="200" width="70" height="200" rx="4" fill="none" stroke="#5a4426" stroke-width="4"/>
  <!-- 塔楼城垛 -->
  <rect x="112" y="184" width="20" height="30" fill="#a07c46" stroke="#5a4426" stroke-width="3"/>
  <rect x="144" y="184" width="20" height="30" fill="#a07c46" stroke="#5a4426" stroke-width="3"/>
  <rect x="176" y="184" width="20" height="30" fill="#a07c46" stroke="#5a4426" stroke-width="3"/>
  <!-- 塔楼红顶 -->
  <polygon points="118,184 155,120 192,184" fill="url(#roof)" stroke="#7a2210" stroke-width="3"/>
  <!-- 塔楼窗 -->
  <rect x="145" y="240" width="20" height="30" rx="10" fill="#1a1208"/>
  <rect x="145" y="300" width="20" height="30" rx="10" fill="#1a1208"/>

  <!-- 右侧塔楼 -->
  <rect x="322" y="200" width="70" height="200" rx="4" fill="#a07c46"/>
  <rect x="322" y="200" width="70" height="200" rx="4" fill="none" stroke="#5a4426" stroke-width="4"/>
  <rect x="314" y="184" width="20" height="30" fill="#a07c46" stroke="#5a4426" stroke-width="3"/>
  <rect x="346" y="184" width="20" height="30" fill="#a07c46" stroke="#5a4426" stroke-width="3"/>
  <rect x="378" y="184" width="20" height="30" fill="#a07c46" stroke="#5a4426" stroke-width="3"/>
  <polygon points="320,184 357,120 394,184" fill="url(#roof)" stroke="#7a2210" stroke-width="3"/>
  <rect x="347" y="240" width="20" height="30" rx="10" fill="#1a1208"/>
  <rect x="347" y="300" width="20" height="30" rx="10" fill="#1a1208"/>

  <!-- 中央主塔 -->
  <rect x="230" y="140" width="52" height="100" rx="4" fill="#b08a4e"/>
  <rect x="230" y="140" width="52" height="100" rx="4" fill="none" stroke="#5a4426" stroke-width="3"/>
  <!-- 主塔顶部旗帜 -->
  <line x1="256" y1="140" x2="256" y2="80" stroke="#5a4426" stroke-width="4"/>
  <polygon points="256,84 306,100 256,116" fill="#e05a3a" stroke="#7a2210" stroke-width="2"/>

  <!-- 金色高光 -->
  <ellipse cx="200" cy="220" rx="30" ry="12" fill="rgba(255,255,255,0.08)"/>
</svg>